name: repair app escaping
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair escaped HTML helper and verify seed removal
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app.js')
          s = p.read_text()
          if 'function seed(' in s:
              raise SystemExit('Production seed function still present')
          lines = s.splitlines()
          fixed = "const esc = v => String(v ?? '').replace(/[&<>\\\"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','\\\"':'&quot;',\"'\":'&#39;' }[c]));"
          for i, line in enumerate(lines):
              if line.startswith('const esc = '):
                  lines[i] = fixed
                  break
          else:
              raise SystemExit('esc helper not found')
          p.write_text('\n'.join(lines) + '\n')
      - name: Commit repair and remove temporary workflow
        run: |
          rm .github/workflows/repair-app-escaping.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js .github/workflows/repair-app-escaping.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore HTML escaping after seed removal'
          git push

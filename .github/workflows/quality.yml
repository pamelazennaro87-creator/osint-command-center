name: OSINT Enterprise Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run behavioral tests
        run: npm test
      - name: Validate API security boundary
        run: npm run test:security
      - name: Validate required architecture files
        run: |
          test -f index.html
          test -f README.md
          test -f ARCHITECTURE.md
          test -f ENTERPRISE_READINESS.md
          test -f SECURITY.md
          test -f package.json
          test -f server/index.mjs
          test -f server/README.md
          test -f src/core/model.js
          test -f src/core/store.js
          test -f src/core/engine.js
          test -f src/core/drift.js
          test -f src/core/assurance.js
          test -f src/core/memory.js
          test -f src/core/decision.js
          test -f src/core/report.js
          test -f src/core/validation.js
          test -f src/core/temporal.js
          test -f src/core/privacy.js
          test -f src/core/intelligence.js
          test -f src/core/daid2.js
          test -f src/tools/lab.js
          test -f src/tools/lab-ui.js
          test -f tests/tools.test.mjs
          test -f src/super-ui.js
          test -f tests/drift.test.mjs
          test -f tests/temporal.test.mjs
          test -f tests/server.test.mjs
          grep -q 'type="module" src="./src/app.js"' index.html
          grep -q 'type="module" src="./src/super-ui.js"' index.html
          grep -q 'type="module" src="./src/tools/lab-ui.js"' index.html

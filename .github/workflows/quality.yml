name: OSINT Enterprise Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript syntax
        run: npm run check
      - name: Run behavioral tests
        run: npm test
      - name: Validate API security boundary
        run: npm run test:security
      - name: Run real browser runtime smoke tests
        run: npm run test:ui
      - name: Validate required architecture files
        run: |
          test -f index.html
          test -f README.md
          test -f ARCHITECTURE.md
          test -f ENTERPRISE_READINESS.md
          test -f SECURITY.md
          test -f package.json
          test -f server/index.mjs
          test -f src/core/model.js
          test -f src/core/store.js
          test -f src/core/engine.js
          test -f src/core/i18n.js
          test -f src/core/bias-radar.js
          test -f src/core/daid2.js
          test -f src/core/investigation-loop.js
          test -f src/tools/lab.js
          test -f src/tools/forensics.js
          test -f src/tools/forensics-ui.js
          test -f src/tools/behavioral-forensics.js
          test -f src/tools/forensic-bridge.js
          test -f src/visual-engine.js
          test -f src/app.js
          test -f src/super-ui.js
          test -f manifest.webmanifest
          test -f tests/ui-runtime.mjs
          grep -q 'type="module" src="./src/app.js"' index.html
          grep -q 'forensics-ui.js' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'viewport' index.html

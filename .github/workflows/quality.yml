name: OSINT Enterprise Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: |
          node --check src/core/model.js
          node --check src/core/store.js
          node --check src/core/engine.js
          node --check src/core/drift.js
          node --check src/core/validation.js
          node --check src/app.js
      - name: Validate required architecture files
        run: |
          test -f index.html
          test -f ARCHITECTURE.md
          test -f src/core/model.js
          test -f src/core/store.js
          test -f src/core/engine.js
          test -f src/core/drift.js
          test -f src/core/validation.js
          grep -q 'type="module" src="./src/app.js"' index.html

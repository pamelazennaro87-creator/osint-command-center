<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BERILL — Temporal OSINT Test</title><style>body{margin:0;background:#071014;color:#e7f1f2;font:14px/1.5 system-ui;padding:24px}main{max-width:1100px;margin:auto}.card{background:#0d1a20;border:1px solid #1b3038;border-radius:12px;padding:18px;margin:14px 0}.tag{display:inline-block;border:1px solid #31515a;border-radius:6px;padding:3px 7px;margin:3px;font-size:11px;color:#69d7d0}.warn{color:#e6bd6a}.ok{color:#7bd69a}.row{padding:12px 0;border-top:1px solid #1b3038}.row:first-child{border-top:0}button{background:#69d7d0;border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer}</style></head><body><main><p class="tag">OSINT ENTERPRISE · TEST FIXTURE</p><h1>BERILL — Shadow Fleet Identity & Ownership Review</h1><p>Temporal integrity test for IMO 9311531. The system must distinguish a timeline change from a logical contradiction.</p><button id="run">Run BERILL test</button><div id="out" class="card">Ready.</div></main><script type="module">import{createCase,createSource,createEvidence,createEntity,createRelationship,createHypothesis,STATUS}from'./src/core/model.js';import{calculateMetrics,contradictionTriage}from'./src/core/engine.js';import{temporalAnalysis,buildTemporalTimeline}from'./src/core/temporal.js';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function run(){const c=createCase({title:'BERILL — Shadow Fleet Identity & Ownership Review',objective:'Determine whether vessel identity, ownership history, flag changes and shadow-fleet indicators remain consistent across independent sources.',priority:'high'});const gur=createSource({name:'GUR official sanctions database',type:'official',locator:'https://war-sanctions.gur.gov.ua/transport/ships/470',reliability:.95,independenceGroup:'official-registry'}),fl=createSource({name:'FleetLeaks vessel history',type:'web',locator:'https://fleetleaks.com/vessels/imo-9311531/',reliability:.75,independenceGroup:'fleet-data'}),vf=createSource({name:'VesselFinder',type:'web',locator:'https://www.vesselfinder.com/it/vessels/details/9311531',reliability:.8,independenceGroup:'fleet-data'});const e=[createEvidence({caseId:c.id,sourceId:gur.id,title:'GUR identity snapshot',claim:'LINDOR, IMO 9311531 is identified in the official sanctions database.',status:STATUS.FACT,confidence:.95,observedAt:'2026-03-03T00:00:00Z',locator:gur.locator}),createEvidence({caseId:c.id,sourceId:fl.id,title:'Name change',claim:'IMO 9311531 changed from LINDOR to BERILL.',status:STATUS.FACT,confidence:.9,observedAt:'2026-08-01T00:00:00Z',locator:fl.locator}),createEvidence({caseId:c.id,sourceId:fl.id,title:'Flag change',claim:'IMO 9311531 changed from Cameroon to Russia.',status:STATUS.FACT,confidence:.9,observedAt:'2026-08-01T00:00:00Z',locator:fl.locator}),createEvidence({caseId:c.id,sourceId:fl.id,title:'Ownership change',claim:'QATIF MARITIME INC changed to VIMAN MARITIME INC for IMO 9311531.',status:STATUS.FACT,confidence:.85,observedAt:'2025-06-06T00:00:00Z',locator:fl.locator}),createEvidence({caseId:c.id,sourceId:gur.id,title:'Shadow-fleet assessment',claim:'GUR reports Russian oil transport and AIS-dark activity associated with IMO 9311531.',status:STATUS.INFERENCE,confidence:.8,observedAt:'2026-03-03T00:00:00Z',locator:gur.locator}),createEvidence({caseId:c.id,sourceId:vf.id,title:'Current identity',claim:'BERILL is listed with IMO 9311531 under Russian flag.',status:STATUS.FACT,confidence:.85,observedAt:'2026-09-10T00:00:00Z',locator:vf.locator})];const a=createEntity({name:'BERILL',type:'asset'}),b=createEntity({name:'LINDOR',type:'asset'}),imo=createEntity({name:'IMO 9311531',type:'asset'});const h=[createHypothesis({caseId:c.id,statement:'BERILL and LINDOR are the same physical vessel.',confidence:.9,falsifier:'Independent registry evidence assigns IMO 9311531 to different physical vessels.'}),createHypothesis({caseId:c.id,statement:'The sequence of identity and ownership changes indicates deliberate opacity.',confidence:.65,falsifier:'Independent corporate and registry records show a transparent ordinary transfer history.'}),createHypothesis({caseId:c.id,statement:'Shadow-fleet indicators are supported by independent evidence.',confidence:.75,falsifier:'Independent evidence materially disproves or misattributes the GUR activity claims.'})];const state={cases:[c],sources:[gur,fl,vf],evidence:e,entities:[a,b,imo],relationships:[createRelationship({caseId:c.id,fromEntityId:a.id,toEntityId:b.id,type:'same_physical_vessel',evidenceIds:[e[0].id,e[1].id],confidence:.95})],hypotheses:h,contradictions:[],decisions:[],audit:[]};const triage=contradictionTriage(state),temporal=temporalAnalysis(state),timeline=buildTemporalTimeline(state,c.id),m=calculateMetrics(state);$('out').innerHTML=`<div class="row"><strong>ENGINE RESULT</strong><br><span class="tag ok">${m.evidence} evidence</span><span class="tag ok">${m.verifiedPct}% verified</span><span class="tag ok">${triage.length} logical contradictions</span><span class="tag warn">${temporal.length} temporal discrepancies</span></div><div class="row"><strong>Critical check</strong><p>${temporal.length?'PASS — The Mar 3 LINDOR snapshot and Aug 1 LINDOR→BERILL change are treated as temporal, not automatically contradictory.':'FAIL — temporal discrepancy not detected.'}</p></div><div class="row"><strong>Timeline</strong>${timeline.map(x=>`<div class="row"><b>${esc(x.date.slice(0,10))}</b> — ${esc(x.title)}<br><small>${esc(x.claim)}</small></div>`).join('')}</div><div class="row"><strong>Analytical rule</strong><p class="warn">A source snapshot at an earlier date must not be treated as evidence that a later state is false.</p></div>`}
$('run').onclick=run;</script></body></html>
